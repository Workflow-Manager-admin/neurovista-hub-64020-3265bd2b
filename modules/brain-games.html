<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Brain Games - MindMeld OS</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <style>
    /* Module-specific overrides for brain-games */
    .brains-hub-container {
      background: var(--tab-bg);
      padding: 38px 18px 34px 18px;
      border-radius: var(--radius);
      box-shadow: 0 8px 34px 0 rgba(30,230,190,0.034);
      min-height: 330px;
      display: flex;
      flex-direction: column;
      gap: 26px;
      align-items: stretch;
      justify-content: flex-start;
      animation: fadeIn 0.3s linear;
    }
    .brains-hub-header {
      display: flex;
      gap: 20px;
      align-items: center;
      background: var(--secondary-bg);
      border-radius: calc(var(--radius) * 0.65);
      padding: 12px 17px 12px 12px;
      box-shadow: 0 1px 7px 0 rgba(40, 230, 210, 0.10);
      border-bottom: 2px solid var(--border);
    }
    .brains-hub-header-icon {
      width: 40px; height: 40px;
      background: var(--accent);
      border-radius: 13px;
      display: flex;align-items:center;justify-content:center;
      box-shadow: 0 1px 4px 0 rgba(30,230,190,0.08);
    }
    .brains-hub-title {
      font-size: 1.7rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      margin: 0; color: var(--accent);
      transition: color var(--transition);
    }
    .brains-hub-tiles {
      display: flex;
      gap: 34px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 18px;
      margin-bottom: 12px;
    }
    .brains-hub-tile {
      background: var(--secondary-bg);
      border: 2.5px solid var(--border);
      border-radius: calc(var(--radius) * 0.73);
      box-shadow: 0 2px 16px 0 rgba(44,218,180,0.11);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 16px;
      width: 210px;
      min-height: 175px;
      padding: 28px 14px 18px 14px;
      cursor: pointer;
      transition: box-shadow 0.15s, border-color 0.16s, transform 0.16s;
      outline: none;
      position: relative;
      font-size: 1.09rem;
    }
    .brains-hub-tile:focus-visible,
    .brains-hub-tile:hover {
      box-shadow: 0 4px 28px 0 rgba(44,218,180,0.17);
      border-color: var(--accent);
      transform: translateY(-5px) scale(1.03);
      z-index: 3;
    }
    .brains-hub-tile-icon {
      font-size: 2.0em;
      width: 38px;
      height: 38px;
      border-radius: 8px;
      background: var(--tab-bg);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 2px;
      box-shadow: 0 1.5px 7px 0 rgba(16,200,180,0.06);
    }
    .brains-hub-tile-title {
      font-size: 1.13em;
      font-weight: 600;
      margin-bottom: 2px;
      color: var(--text);
      letter-spacing: .02em;
      text-align: center;
    }
    .brains-hub-tile-desc {
      font-size: 0.97em;
      color: var(--text-secondary);
      text-align: center;
      min-height: 2.3em;
      opacity: 0.94;
    }
    @media (max-width: 960px) {
      .brains-hub-tiles { flex-wrap: wrap; gap: 18px;}
      .brains-hub-tile { width: 165px; min-height: 128px;}
      .brains-hub-header-title { font-size: 1.1rem;}
    }
    @media (max-width: 600px) {
      .brains-hub-container { padding: 13px 4.5vw; }
      .brains-hub-tiles { gap: 11px; }
      .brains-hub-tile { width: 98vw; max-width: 360px; min-height: 98px; padding: 18px 10px;}
      .brains-hub-header { gap: 10px; padding: 9px 8px 8px 9px;}
      .brains-hub-title { font-size: 1.06rem;}
    }

    /* Minimal in-module game view styling */
    .brains-game-back {
      display: inline-flex; align-items: center;
      gap: 5px; margin-bottom: 18px; font-size: 0.98em;
      color: var(--accent);
      background: none; border: none; cursor: pointer;
      padding: 3px 8px 3px 2px; border-radius: 6px;
      transition: background 0.13s;
    }
    .brains-game-back:hover,
    .brains-game-back:focus-visible {
      background: var(--tab-bg);
      color: var(--accent);
      text-decoration: underline;
    }
    .brains-game-main {
      background: var(--secondary-bg);
      border-radius: calc(var(--radius) * 0.6);
      padding: 22px 7vw 36px 7vw;
      box-shadow: 0 2px 12px 0 rgba(40,240,210,0.09);
      margin-top: 0;
      color: var(--text);
      min-height: 180px;
      animation: fadeIn .22s linear;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      text-align: center;
    }
    @media (max-width: 600px) {
      .brains-game-main { padding: 14px 7px 24px 7px;}
      .brains-game-back { font-size: 0.91em;}
    }
    @keyframes fadeIn { from {opacity: 0;} to {opacity: 1;} }
  </style>
</head>
<body>
  <section class="brains-hub-container" id="brains-hub-container">
    <header class="brains-hub-header">
      <span class="brains-hub-header-icon">
        <!-- Brain (emoji fallback) -->
        <span style="font-size:2em;" aria-hidden="true">🧩</span>
      </span>
      <h1 class="brains-hub-title">Brain Games Hub</h1>
    </header>
    <div class="brains-hub-tiles" id="brains-hub-tiles">
      <button class="brains-hub-tile" data-game="pattern-recognition" tabindex="0">
        <span class="brains-hub-tile-icon" aria-hidden="true">🔳</span>
        <span class="brains-hub-tile-title">Pattern Recognition</span>
        <span class="brains-hub-tile-desc">Spot sequences and discover the logic in rapid puzzles.</span>
      </button>
      <button class="brains-hub-tile" data-game="reaction-time" tabindex="0">
        <span class="brains-hub-tile-icon" aria-hidden="true">⚡</span>
        <span class="brains-hub-tile-title">Reaction Time</span>
        <span class="brains-hub-tile-desc">Test and train your reflexes. How quick is your mind?</span>
      </button>
      <button class="brains-hub-tile" data-game="memory-match" tabindex="0">
        <span class="brains-hub-tile-icon" aria-hidden="true">🧠</span>
        <span class="brains-hub-tile-title">Memory Match</span>
        <span class="brains-hub-tile-desc">Flip tiles, match pairs, and build your working memory.</span>
      </button>
    </div>
    <div id="brains-game-area"></div>
  </section>
  <script>
    // Brain Games Hub - in-module navigation logic
    (function() {
      // Tiles (menu/card) logic
      const tileButtons = Array.from(document.querySelectorAll('.brains-hub-tile'));
      const hubTiles = document.getElementById('brains-hub-tiles');
      const gameArea = document.getElementById('brains-game-area');
      let inGame = false;
      // Game name to display mapping
      const GAME_NAMES = {
        'pattern-recognition': 'Pattern Recognition',
        'reaction-time': 'Reaction Time',
        'memory-match': 'Memory Match'
      };
      // Placeholder template for each game UI
      const GAME_PLACEHOLDERS = {
        'pattern-recognition':
          `<button class="brains-game-back" type="button" aria-label="Back to Brain Games Hub">
            <span aria-hidden="true">←</span> Hub
          </button>
          <div class="brains-game-main" id="pattern-recognition-root">
            <h2 style="color:var(--accent);margin-bottom:8px;">Pattern Recognition</h2>
            <p style="margin-bottom:22px;">Memorize the sequence! Click the tiles in the pattern's order.<br>
              <small style="color:var(--text-secondary);">Each round, a sequence will flash. Reproduce it to score!</small>
            </p>
            <div id="pattern-grid" style="display:inline-grid;grid-template-columns:repeat(3,38px);gap:13px;margin-bottom:14px;margin-top:20px;"></div>
            <button id="start-pattern-btn" class="btn" style="margin-bottom:7px;">Start</button>
            <div id="pattern-feedback" style="height:28px;margin-top:7px;font-size:1.03em;color:var(--accent);font-weight:500;"></div>
            <div id="pattern-score" style="margin-top:2px;color:var(--text-secondary);font-size:0.98em;">Score: 0</div>
          </div>`,
        'reaction-time':
          `<button class="brains-game-back" type="button" aria-label="Back to Brain Games Hub">
             <span aria-hidden="true">←</span> Hub
           </button>
           <div class="brains-game-main" id="reaction-time-root">
             <h2 style="color:var(--accent);">Reaction Time Tester</h2>
             <p id="reaction-desc">When you click <b>Start</b>, wait for the screen to turn <span style="color:var(--accent);font-weight:600;">green</span>.<br>
               <span style="color:var(--text-secondary);">Tap/click as fast as you can when ready!<br>
               If you click too soon, you'll have to retry.</span>
             </p>
             <div id="reaction-box" style="width:198px;height:85px;display:flex;justify-content:center;align-items:center;background:#ddd; border-radius:13px;cursor:pointer;transition:background 0.12s;font-size:1.1em;font-weight:600;color:var(--text); margin:14px 0 10px 0;border:2.2px solid var(--border);">
               <button id="start-reaction-btn" class="btn" style="font-size:1.06em;">Start</button>
             </div>
             <div id="reaction-feedback" style="min-height:32px;margin-top:0.7em;font-size:1.06em;font-weight:500;color:var(--accent);"></div>
             <div id="reaction-last" style="margin-top:0.1em;color:var(--text-secondary);font-size:0.97em;">Best: -- ms</div>
           </div>`,
        'memory-match':
          `<button class="brains-game-back" type="button" aria-label="Back to Brain Games Hub">
             <span aria-hidden="true">←</span> Hub
           </button>
           <div class="brains-game-main">
             <h2 style="color:var(--accent);">Memory Match</h2>
             <p>This is a placeholder for the Memory Match minigame.<br>
             Card-matching gameplay goes here.</p>
             <div style="font-size:2.1em;margin-top:22px;" aria-hidden="true">🧠🃏🎴</div>
           </div>`
      };

      // For accessibility: allow tab, space, and enter on cards
      function onTileClickOrEnter(ev) {
        if (ev.type === 'click' || ev.key === ' ' || ev.key === 'Enter') {
          const game = ev.currentTarget.getAttribute('data-game');
          showGame(game);
        }
      }
      tileButtons.forEach(btn => {
        btn.addEventListener('click', onTileClickOrEnter);
        btn.addEventListener('keydown', function(ev) {
          if (ev.key === ' ' || ev.key === 'Enter') {
            onTileClickOrEnter(ev);
          }
        });
      });

      // PUBLIC_INTERFACE
      function showGame(gameName) {
        if (!GAME_PLACEHOLDERS[gameName]) return;
        gameArea.innerHTML = GAME_PLACEHOLDERS[gameName];
        hubTiles.style.display = 'none';
        inGame = true;
        // Setup "Back to hub" button inside gamemode UI
        const backBtn = gameArea.querySelector('.brains-game-back');
        if (backBtn) {
          backBtn.addEventListener('click', backToHub);
          backBtn.addEventListener('keydown', function(ev){
            if (ev.key === " " || ev.key === "Enter") {
              ev.preventDefault();
              backToHub();
            }
          });
        }
      }
      function backToHub() {
        gameArea.innerHTML = '';
        hubTiles.style.display = 'flex';
        inGame = false;
        // Return focus to first tile for accessibility
        if (tileButtons[0]) tileButtons[0].focus();
      }
      // For browser navigation: support in-module "back" (optional)
      window.addEventListener('popstate', () => {
        if (inGame) { backToHub(); }
      });
    })();

    // Pattern Recognition Game JS (minimal logic for prototype)
    (function() {
      const area = document.getElementById('brains-game-area');
      // ---- Pattern Recognition game logic (as before) ----
      let sequence = [];
      let userInput = [];
      let acceptingInput = false;
      let round = 0;
      let score = 0;
      let gridBtns = [];
      function patternGameMount() {
        const root = area.querySelector('#pattern-recognition-root');
        if (!root) return;
        const grid = root.querySelector('#pattern-grid');
        const btn = root.querySelector('#start-pattern-btn');
        const feedback = root.querySelector('#pattern-feedback');
        const scoreBlock = root.querySelector('#pattern-score');
        grid.innerHTML = '';
        sequence = [];
        userInput = [];
        acceptingInput = false;
        round = 0;
        score = 0;
        gridBtns = [];
        // Create a 3x3 grid of buttons
        for (let i = 0; i < 9; ++i) {
          const tile = document.createElement('button');
          tile.type = 'button';
          tile.setAttribute('aria-label', `Tile ${i+1}`);
          tile.style.width = '38px';
          tile.style.height = '38px';
          tile.style.background = '#eee';
          tile.style.border = '2px solid var(--border)';
          tile.style.borderRadius = '9px';
          tile.style.transition = 'background 0.19s,border 0.18s;';
          tile.style.outline = 'none';
          tile.style.cursor = 'pointer';
          tile.dataset.idx = i;
          tile.tabIndex = 0;
          tile.innerHTML = '';
          tile.addEventListener('click', onGridClick);
          grid.appendChild(tile);
          gridBtns.push(tile);
        }
        feedback.textContent = 'Press Start to Play!';
        scoreBlock.textContent = 'Score: 0';
        btn.textContent = 'Start';
        btn.disabled = false;
        btn.onclick = startGame;
      }
      function startGame() { score = 0; round = 0; showScore(); nextRound(); }
      function showScore() {
        const root = area.querySelector('#pattern-recognition-root');
        if (!root) return;
        const scoreBlock = root.querySelector('#pattern-score');
        scoreBlock.textContent = `Score: ${score}`;
      }
      function showFeedback(text, color) {
        const root = area.querySelector('#pattern-recognition-root');
        if (!root) return;
        const feedback = root.querySelector('#pattern-feedback');
        feedback.textContent = text;
        feedback.style.color = color || 'var(--accent)';
      }
      function highlight(idx) {
        if (!gridBtns[idx]) return;
        gridBtns[idx].style.background = '#11e497';
        gridBtns[idx].style.border = '2.2px solid #09c18c';
        setTimeout(() => {
          gridBtns[idx].style.background = '#eee';
          gridBtns[idx].style.border = '2px solid var(--border)';
        }, 400);
      }
      function sleep(ms) { return new Promise(res=>setTimeout(res,ms)); }
      async function showPattern(seq) {
        acceptingInput = false;
        for (let i=0;i<seq.length;++i) {
          highlight(seq[i]);
          await sleep(510);
        }
        acceptingInput = true;
        userInput = [];
        showFeedback('Your turn: Repeat the pattern!','var(--text-secondary)');
      }
      function nextRound() {
        round++;
        showFeedback(`Round ${round}: Watch and repeat.`,'var(--accent)');
        sequence.push(Math.floor(Math.random()*9));
        setTimeout(() => showPattern(sequence),500);
      }
      function onGridClick(ev) {
        if (!acceptingInput) return;
        const idx = Number(ev.currentTarget.dataset.idx);
        highlight(idx);
        userInput.push(idx);
        const curr = userInput.length-1;
        if (userInput[curr] !== sequence[curr]) {
          gameOver();
          return;
        }
        if (userInput.length === sequence.length) {
          score+= 1;
          showScore();
          showFeedback('Correct! Next round...','#11e497');
          acceptingInput = false;
          setTimeout(nextRound,900);
        }
      }
      function gameOver() {
        acceptingInput = false;
        showFeedback('Wrong! Game Over. Score: '+score,'#ff416c');
        const btn = area.querySelector('#pattern-recognition-root #start-pattern-btn');
        if (btn) {
          btn.textContent = 'Restart';
          btn.disabled = false;
        }
      }
      // Attach to page updates: when pattern-recognition div appears, run mount
      const observer = new MutationObserver(() => {
        patternGameMount();
        reactionGameMount();
      });
      observer.observe(area, {childList:true, subtree:true});
      // Initial attach if already present:
      patternGameMount();

      // ---- Reaction Time Tester (core logic) ----
      function reactionGameMount() {
        const rroot = area.querySelector('#reaction-time-root');
        if (!rroot) return;
        let state = 'init'; // states: init, waiting, ready, clicked, tooSoon
        let timer = null;
        let startTime = null;
        let bestScore = null;
        let lastTime = null;

        const box = rroot.querySelector('#reaction-box');
        const feedback = rroot.querySelector('#reaction-feedback');
        const lastBlock = rroot.querySelector('#reaction-last');
        const startBtn = rroot.querySelector('#start-reaction-btn');

        function resetBox() {
          box.style.background = "#ddd";
          box.style.border = "2.2px solid var(--border)";
          box.textContent = "";
          box.innerHTML = `<button id="start-reaction-btn" class="btn" style="font-size:1.06em;">Start</button>`;
          feedback.textContent = '';
          state = 'init';
          if (lastBlock && lastTime !== null) {
            lastBlock.textContent = `Best: ${bestScore !== null ? bestScore+' ms':'--'}${lastTime!==null ? ' | Last: '+lastTime+' ms' : ''}`;
          }
          // Set up event again
          rroot.querySelector('#start-reaction-btn').onclick = startWaiting;
        }

        function startWaiting() {
          state = 'waiting';
          feedback.textContent = 'Wait for green...';
          box.style.background = "#ffec82";
          box.style.border = "2.4px solid #eec51a";
          box.innerHTML = `<span>...</span>`;
          // Clear handlers (prevent double start)
          box.onclick = null;
          // Random wait: 700ms - 1700ms
          const wait = 700+Math.random()*1000;
          timer = setTimeout(() => {
            state = 'ready';
            startTime = performance.now();
            box.style.background = "#43e09f";
            box.style.border = "2.4px solid #22b366";
            box.innerHTML = `<span style="font-size:1.18em;">TAP!</span>`;
            feedback.textContent = "Go!";
            box.onclick = reactionClick;
          }, wait);
          // Detect false start:
          box.onclick = earlyClick;
        }

        function earlyClick() {
          if (state === 'waiting') {
            state = 'tooSoon';
            clearTimeout(timer);
            box.style.background = "#ff416c";
            box.style.border = "2.4px solid #c2184f";
            box.innerHTML = `<span style="color:#fff;font-weight:600;">Too soon!</span>`;
            feedback.textContent = "Oops, try again!";
            setTimeout(resetBox, 900);
          }
        }

        function reactionClick() {
          if (state !== 'ready') return;
          state = 'clicked';
          const delta = Math.round(performance.now() - startTime);
          feedback.textContent = `Your reaction: ${delta} ms`;
          lastTime = delta;
          if (bestScore === null || delta < bestScore) bestScore = delta;
          box.style.background = "#aae9bf";
          box.style.border = "2.5px solid #36ae77";
          box.innerHTML = `<span style="font-size:1.15em;">${delta} ms</span>`;
          if (lastBlock) lastBlock.textContent = `Best: ${bestScore} ms | Last: ${lastTime} ms`;
          setTimeout(resetBox, 1100);
        }

        // Attach start event on mount
        resetBox();
      }

      // Also mount on direct navigation
      reactionGameMount();

    })();
  </script>
</body>
</html>
