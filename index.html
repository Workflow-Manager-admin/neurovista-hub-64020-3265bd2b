<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MindMeld OS</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="mmos-app">
    <aside class="mmos-sidebar" id="sidebar">
      <div class="mmos-logo">🧠 MindMeld OS</div>
      <nav>
        <ul class="mmos-sidebar-nav" id="sidebar-nav">
          <li data-module="dashboard" class="active">
            <span><img src="assets/dashboard.svg" alt="Dashboard icon" width="24" height="24" /></span>
            <span>Dashboard</span>
          </li>
          <li data-module="brain-games">
            <span><img src="assets/brain-games.svg" alt="Brain Games icon" width="24" height="24" /></span>
            <span>Brain Games</span>
          </li>
          <li data-module="illusions">
            <span><img src="assets/illusions.svg" alt="Illusions icon" width="24" height="24" /></span>
            <span>Optical Illusions</span>
          </li>
          <li data-module="mindfulness">
            <span><img src="assets/mindfulness.svg" alt="Mindfulness icon" width="24" height="24" /></span>
            <span>Mindfulness</span>
          </li>
          <li data-module="chatbot">
            <span><img src="assets/chatbot.svg" alt="Chatbot icon" width="24" height="24" /></span>
            <span>AI Chatbot</span>
          </li>
          <li data-module="youtube-downloader">
            <span><img src="assets/youtube-downloader.svg" alt="YouTube Downloader icon" width="24" height="24" /></span>
            <span>YouTube Downloader</span>
          </li>
          <li data-module="trivia">
            <span><img src="assets/trivia.svg" alt="Trivia icon" width="24" height="24" /></span>
            <span>Trivia</span>
          </li>
          <li data-module="canvas">
            <span><img src="assets/canvas.svg" alt="Canvas icon" width="24" height="24" /></span>
            <span>Canvas</span>
          </li>
          <li data-module="easter-eggs">
            <span><img src="assets/easter-eggs.svg" alt="Easter Eggs icon" width="24" height="24" /></span>
            <span>Easter Eggs</span>
          </li>
        </ul>
      </nav>
      <button id="sidebar-toggle" aria-label="Toggle Sidebar">≡</button>
    </aside>
    <main class="mmos-main-content" id="main-content">
      <!-- Modern-looking tab bar: tabs will be inserted/managed by JS -->
      <div id="tab-bar" class="mmos-tabs">
        <!-- Dynamic tabs go here -->
      </div>
      <section id="tab-content" class="mmos-tab-content">
        <!-- Module content will be dynamically loaded here -->
        <div class="mmos-welcome" id="mmos-welcome">
          <h1>Welcome to MindMeld OS</h1>
          <p>A modular browser-based OS for cognitive stimulation.</p>
          <p>Select a feature from the sidebar to begin.</p>
        </div>
      </section>
    </main>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
